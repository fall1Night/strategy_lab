# =====================================================================
# 策略配置：日线 KDJ 监控 + MACD 金叉买入（Strategy Lab 4.0 新策略）
# ---------------------------------------------------------------------
# 想改参数 / 新增策略，复制本文件改 [params] 即可，运行时不改任何代码。
#   - name   : 展示用名称
#   - type   : 必须对应 engine/strategies/kdj_macd_cross.py 的 type 字段
#   - market : china_a / us_stock / hong_kong
# 运行示例见 README.md
# =====================================================================

name = "日线KDJ监控 + MACD金叉买入"
type = "kdj_macd_cross"
market = "china_a"
description = "日线KDJ金叉进入监控态, 监控态下日线MACD金叉尾盘买入底仓; 持仓回撤≥5%(相对买入价)或日线MACD死叉尾盘清仓; 清仓后可再循环。"

[params]
initial_cash = 200000          # 初始资金(元)
buy_amount = 100000            # 单次买入额(元)
commission = 0.0003            # 佣金(双边, 比例)
stamp_tax = 0.0005             # 印花税(仅卖方, 比例)
lot_size = 100                 # A股每手股数
execution = "same_day_close"   # 执行价: 当日信号+当日收盘(含 look-ahead 偏差)

[params.macd]
fast = 12
slow = 26
signal = 9

[params.kdj]
n = 9
m1 = 3
m2 = 3

# ---- 清仓 ----
[params.exit]
drawdown_threshold = 0.05      # 持仓回撤≥此值(相对买入成交价)清仓
macd_death_cross = true        # 日线MACD任意死叉(DIF下穿DEA)清仓
