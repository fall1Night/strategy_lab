# =====================================================================
# 策略配置：大周期定势 · 缩量回踩低吸（trend_pullback）
# ---------------------------------------------------------------------
# 口诀：大周期定方向，20日线定趋势，缩量回踩找买点，
#       放量上涨拿波段，破线放量立刻走。
# 对应规则文档：docs/trend_pullback_规则说明.md
# =====================================================================

name = "大周期定势·缩量回踩"
type = "trend_pullback"
market = "china_a"
description = "周线走平/回升定方向，日线20均定趋势；强庄/低位小票分型，金叉放量、回踩缩量三通道低吸；放量下跌即出货，破线放量立刻走，爆量滞涨分批止盈。"

[params]
initial_cash = 200000          # 初始资金(元)
buy_ratio = 0.95               # 买入占可用资金比例
lot_size = 100                 # A股每手股数
commission = 0.0003            # 佣金(双边, 比例)
stamp_tax = 0.0005             # 印花税(仅卖方, 比例)

# ---------------- 1. 大周期门控（周线） ----------------
# 走平/回升判定：周线快/慢均线近 slope_weeks 周变化率 >= -flat_tol；
# 下降趋势一律空仓。require_above_fast=true 还要求周收盘站上快均线。
[params.major]
ma_fast = 20                   # 周线快均线（≈ 100 个交易日）
ma_slow = 30                   # 周线慢均线（≈ 150 交易日，近似月线趋势）
slope_weeks = 4                # 斜率观察窗口（周）
flat_tol = 0.005               # 走平容差：变化率 ≥ -0.5% 视为走平/回升
require_above_fast = true      # 周收盘须在快均线上方

# ---------------- 2. 标的分型（滚动历史，无未来函数） ----------------
[params.profile]
lookback = 250                 # 主升记忆回溯窗口（交易日）
dragon_min_gain = 0.40         # 区间最高/最低涨幅 ≥ 40% → 有主升记忆
dragon_limit_days = 2          # 区间内大涨日(≥limit_pct)次数 ≥ N → 有资金记忆
limit_pct = 0.098              # 大涨阈值（主板涨停≈9.8%）
low_pos_drawdown = 0.30        # 距区间高点回撤 ≥ 30% → 处于低位
range_window = 60              # 横盘观察窗口
range_band = 0.25              # (60日最高-最低)/最低 ≤ 25% → 横盘打底
vol_dry_ratio = 0.85           # 近20日均量/近120日均量 ≤ 0.85 → 缩量洗盘充分

# ---------------- 3. 入场通道 ----------------
[params.entry]
ma5 = 5
ma10 = 10
ma20 = 20
vol_ma = 5                     # 量能基准（5日均量）
breakout_vol = 1.3             # 通道A：金叉当日量 ≥ 1.3×量均（底部放量）
turn_up_days = 1               # MA20 当日较前一日抬升即「拐头向上」（平的/向下无效）
pullback_touch = 0.015         # 回踩触线容差：low ≤ ma*(1+1.5%) 视为踩线
pullback_vol = 0.80            # 通道B缩量：vol ≤ 0.8×量均
smallcap_vol = 0.70            # 通道C更严缩量：vol ≤ 0.7×量均
smallcap_vol_pctile = 0.30     # 通道C：近5日均量处于近60日分位 ≤ 30%（抛压耗尽）
no_newlow_window = 20          # 回踩不创新低（20日内低点之上）
up_vol_min = 1.0               # 上涨放量下限（vol ≥ 1.0×量均）
down_vol_max = 1.2             # 放量阴线/放量下跌阈值（vol ≥ 1.2×量均 → 出货）

# ---------------- 4. 出场 ----------------
[params.exit]
use_ma20_stop = true           # 趋势票止损开关
stop_vol = 1.0                 # 破MA20放量确认：当日 vol ≥ 1.0×量均
smallcap_stop_ma = 10          # 低位小票：收盘破 MA10 即走（破10收不回）
death_cross_exit = true        # MA5 下穿 MA20 → 趋势走坏清仓
take_profit = true             # 分批止盈开关
tp_min_gain = 0.08             # 浮盈 ≥ 8% 才允许触发止盈（首次放量拉升不跑）
tp_vol_blowoff = 2.0           # 爆量：vol ≥ 2.0×量均
tp_upper_shadow = 0.45         # 长上影：上影/全幅 ≥ 45% 或收平/收跌 → 高位滞涨
tp_ratio = 0.5                 # 分批止盈比例（首次触发卖 50%）
