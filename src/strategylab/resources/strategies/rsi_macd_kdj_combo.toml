# =====================================================================
# 策略配置：周线MACD + 日线RSI/KDJ 综合策略
# ---------------------------------------------------------------------
# 综合自两个既有策略：
#   - rsi.toml            : RSI(12) 上穿30建仓信号 / 下穿70清仓 / 收益峰值回撤清仓
#   - kdj_macd_dual_entry.toml : 周线MACD柱<0监控区 / hist回升动能筑底 / 日线J<50买底仓
# 本策略取其交集并去除「做T」：
#   监控区=周线MACD柱(hist)<0；开始判定=RSI(12)上穿30「且」周线hist较上周上涨同时成立；
#   买入=日线KDJ的J<50尾盘买底仓；清仓=RSI(12)下穿70或有持仓且净值峰值回撤≥5%。
#   - name   : 展示用名称
#   - type   : 必须对应 engine/strategies/rsi_macd_kdj_combo.py 的 type 字段
#   - market : china_a / us_stock / hong_kong
# 运行示例见 README.md
# =====================================================================

name = "周线MACD + 日线RSI/KDJ 综合"
type = "rsi_macd_kdj_combo"
market = "china_a"
description = "周线MACD柱<0监控区; RSI(12)上穿30且周线hist回升同时成立开始判定; 日线KDJ的J<50尾盘买底仓; RSI(12)下穿70或收益峰值回撤5%清仓。"

[params]
initial_cash = 200000          # 初始资金(元)
base_buy_amount = 100000       # 底仓单笔买入额(元)
commission = 0.0003            # 佣金(双边, 比例)
stamp_tax = 0.0005             # 印花税(仅卖方, 比例)
lot_size = 100                 # A股每手股数
execution = "same_day_close"   # 执行价: 当日信号+当日收盘(含 look-ahead 偏差)

[params.macd]
fast = 12
slow = 26
signal = 9

[params.kdj]
n = 9
m1 = 3
m2 = 3

# ---- 监控区 + 开始判定 + 买入底仓 ----
[params.entry]
enabled = true
armed_hist_below_zero = true   # 周线MACD柱(hist)<0 才进入监控区
armed_hist_rising = true       # 某一周 hist 较上周上涨(动能筑底转强)
disarm_hist_above_zero = true  # hist 回到 0 轴上方自动解除监控
j_buy = 50                     # 当日线 J < 此值 尾盘买入底仓
# 开始判定还需: 日线 RSI(period) 上穿 oversold（见 [params.rsi]）

# ---- 清仓: 日线 RSI 下穿 overbought 清仓 ----
[params.rsi]
period = 12                    # RSI 计算周期
oversold = 30                  # 上穿此值(与 hist 回升同时成立) → 开始判定
overbought = 70                # 下穿此值(有持仓) → 清仓

# ---- 移动止盈/回撤止损: 持仓期间净值从收益峰值回落 >= 此值 清仓 ----
[params.trailing_stop]
peak_drawdown_pct = 0.05

# ---- 风控: 同一时间只持一笔底仓 ----
[params.single_base_position]
enabled = true
