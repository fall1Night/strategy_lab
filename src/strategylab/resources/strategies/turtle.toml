# =====================================================================
# 策略配置：海龟交易法则（唐奇安通道突破 + ATR 止损）
# ---------------------------------------------------------------------
# 这是「可维护的策略库」中的一条策略。想改参数 / 新增策略，复制本文件
# 改 [params] 即可，运行时不改任何代码。
#   - name   : 展示用名称
#   - type   : 必须对应 engine/strategies/ 下某个策略类的 type 字段
#   - market : china_a / us_stock / hong_kong
# 运行示例见 README.md
# =====================================================================

name = "海龟交易法则(唐奇安突破+ATR止损)"
type = "turtle"
market = "china_a"
description = "日线唐奇安通道突破: 收盘价突破20日最高价买入, 跌破10日最低价或回撤超2倍ATR止损离场; 按ATR海龟单位确定仓位。"

[params]
initial_cash = 200000          # 初始资金(元)
base_buy_amount = 100000       # 单笔买入额上限(元), 约束海龟单位放大, 避免小ATR时过度杠杆
commission = 0.0003            # 佣金(双边, 比例)
stamp_tax = 0.0005             # 印花税(仅卖方, 比例)
lot_size = 100                 # A股每手股数
execution = "same_day_close"   # 执行价: 当日信号+当日收盘(含 look-ahead 偏差)

# ---- 海龟参数 ----
[params.turtle]
entry_lookback = 20             # 入场通道周期: 收盘价突破过去 N 日最高价买入
exit_lookback = 10              # 离场通道周期: 收盘价跌破过去 N 日最低价卖出
atr_period = 14                 # ATR(平均真实波幅) 计算周期
atr_stop_multiple = 2.0         # ATR 止损倍数: 回撤超过 multiple×ATR 止损离场
use_atr_stop = true             # 是否启用 ATR 止损(默认开启)
risk_per_trade = 0.01           # 每笔风险占账户权益比例(海龟单位: 1%)
trailing_stop = false           # 是否启用 ATR 止损基线随新高上移(可选, 默认关)
