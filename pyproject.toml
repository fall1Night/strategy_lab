[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strategylab"
version = "0.2.0"
description = "A股周线MACD+日线KDJ双入口做T量化回测服务（结果落库，DB无关）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "pandas",
    "numpy",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["ruff", "black", "mypy", "pytest", "pytest-cov"]
postgres = ["psycopg2-binary>=2.9"]

[project.scripts]
strategylab = "strategylab.cli:main"
strategylab-web = "strategylab.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"strategylab.resources" = ["**/*"]
"strategylab.engine.vendor" = ["*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=strategylab --cov-report=term-missing"
